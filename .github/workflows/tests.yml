name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run tests in Docker
        run: ./tests/run.sh
      - name: Run ShellCheck in Docker
        if: ${{ !cancelled() }}
        run: ./tests/lint.sh
