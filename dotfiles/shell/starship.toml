"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = '$kubernetes${env_var.AWS_VAULT}$hostname$time$character$directory$git_branch$git_status'

[env_var.AWS_VAULT]
format = '[$env_value]($style) '
style = 'bold yellow'

[kubernetes]
disabled = false
format = '\([$context]($style)\)'
style = 'blue'

[hostname]
ssh_only = false
format = '[$hostname]($style) '
style = 'bold blue'

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[\[$time\]]($style) '
style = 'bold green'

[directory]
format = '[$path]($style) '
style = 'cyan'
truncation_length = 1
truncate_to_repo = false

[git_branch]
format = '[git:\(](bold blue)[$branch](red)[\)](blue) '

[git_status]
style = 'yellow'

[character]
format = '$symbol  '
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = '[➜](bold green)'
